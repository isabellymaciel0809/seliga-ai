  <script>/* aplica tema e contraste salvos antes de desenhar, para a tela não piscar */try{var d=document.documentElement;if(localStorage.getItem("fe_tema")==="escuro")d.dataset.tema="escuro";if(localStorage.getItem("fe_contraste")==="alto")d.dataset.contraste="alto"}catch(e){}</script>

<body data-pagina="checklist">
  <div class="casca">
    <div id="topo-site"></div>
    <main id="conteudo" class="conteudo">
      <div class="cabecalho-pagina">
        <h1><span data-icone="checklist"></span> Minha segurança digital</h1>
        <p>Responda com sinceridade: ninguém vê suas respostas, elas ficam só neste aparelho. No final, você recebe uma nota e um plano do que melhorar.</p>
      </div>
      <ol id="itens" class="lista-check"></ol>
      <section id="resultado" class="secao" aria-live="polite"></section>
    </main>
  </div>

  <script src="js/comum.js" defer></script>
